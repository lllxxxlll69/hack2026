services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dean
      POSTGRES_USER: dean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py first}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dean -d dean"]
      interval: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dean:${POSTGRES_PASSWORD}@db:5432/dean
      DATA_DIR: /app/runtime
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - files:/app/runtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  postgres:
  files:
